name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional stable release version, for example v1.0.1'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & test Dot[9]
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'

      - name: Restore
        run: dotnet restore .\Dot9.sln

      - name: Build
        run: dotnet build .\Dot9.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\tests\Dot9.Tests\Dot9.Tests.csproj -c Release --no-build

  # Versioned releases are the auto-update channel: Velopack publishes a Setup.exe
  # plus an update feed (releases.win.json) that installed apps read on launch.
  # To ship an update: bump <Version> in Dot9.csproj and push a vX.Y.Z tag.
  release:
    name: Publish Velopack auto-update release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { '${{ inputs.release_version }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must look like v1.0.1. Received: $tag"
          }
          $version = $tag.TrimStart('v')
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Publish (self-contained folder for Velopack)
        shell: pwsh
        run: dotnet publish .\src\Dot9\Dot9.csproj -c Release -r win-x64 --self-contained true -o .\publish

      - name: Pack Velopack release
        shell: pwsh
        run: vpk pack -u Dot9 -v ${{ steps.ver.outputs.version }} -p .\publish -e Dot9.exe --packTitle "Dot[9]"

      - name: Upload release to GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "Dot[9] ${{ steps.ver.outputs.tag }}"
          --tag ${{ steps.ver.outputs.tag }}
          --token $env:GH_TOKEN
